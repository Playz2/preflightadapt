<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PreFlight - verificare înainte de publicare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect width="26" height="26" rx="6" fill="#4338CA" />
        <path d="M5 13 L21 5.5 L15.5 20.5 L12.5 15 Z" fill="#fff" />
        <circle cx="23" cy="23" r="5.4" fill="#16A34A" stroke="#0F172A" stroke-width="1.4" />
        <path d="M20.6 22.9 L22.4 24.6 L25.4 21.2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="name">PreFlight</span>
      <span class="tag">Verifică înainte să decolezi.</span>
    </div>
    <div class="kit" id="kit"></div>
  </header>

  <main>
    <section class="left">
      <label id="empty" class="drop big">
        <input id="file" type="file" accept="image/png,image/jpeg" hidden />
        <strong>Trage aici reclama</strong>
        <span>PNG sau JPG exportat din Adobe Express • sau click pentru a alege</span>
      </label>

      <div id="stage" hidden>
        <div class="toolbar">
          <div class="seg"><button id="before">Înainte</button><button id="after" class="on">După</button></div>
          <div class="spacer"></div>
          <button id="reset" class="ghost">Reia de la original</button>
          <button id="download" class="ghost">Descarcă PNG</button>
        </div>
        <div class="canvaswrap"><canvas id="view"></canvas></div>
        <label id="sources" class="drop small">
          <input id="srcfile" type="file" accept="image/*" multiple hidden />
          <b>Imagini sursă (opțional)</b>: trage aici imaginile originale din Firefly pentru verificarea Content Credentials
        </label>
      </div>
    </section>

    <aside class="panel">
      <div id="ring" class="ring"><div><span id="score">-</span><small>din 100</small></div></div>
      <div class="chips">
        <div id="chip-brand" class="chip"><b>-</b><span>Brand</span></div>
        <div id="chip-accessibility" class="chip"><b>-</b><span>Accesib.</span></div>
        <div id="chip-legal" class="chip"><b>-</b><span>Legal</span></div>
        <div id="chip-ai_act" class="chip"><b>-</b><span>AI Act</span></div>
      </div>
      <div class="tol-box">
        <div class="tol-head">
          <label for="min-area">Toleranță suprafață minimă</label>
          <b id="min-area-val">0.5%</b>
        </div>
        <input id="min-area" type="range" min="0" max="20" step="0.5" value="0.5" />
        <small>Ignoră elementele cu suprafața &lt; <span id="min-area-inline">0.5</span>% din pagină</small>
      </div>
      <div id="prov" class="prov"></div>
      <div id="status" class="status"></div>
      <div id="issues" class="issues"></div>
      <div class="actions">
        <button id="fixall" class="primary" disabled>Fix all</button>
        <button id="run" class="secondary">Re-verifică</button>
      </div>
      <p class="disclaimer">Suport decizional, nu consultanță juridică. Decizia finală rămâne la tine.</p>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
