<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="PreFlight: verificare de conformitate înainte de publicarea unei reclame" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PreFlight</title>
        <script type="module" src="add-on-console-override.js"></script>
        <style>
            body { margin: 0; padding: 16px; font-family: Inter, system-ui, sans-serif; color: #0f172a; }
            button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #4338ca; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
            button:disabled { opacity: 0.6; cursor: default; }
            pre { margin: 12px 0 0; padding: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-word; background: #f1f5f9; border-radius: 8px; }
            pre:empty { display: none; }
        </style>
    </head>
    <body>
        <button id="scan" disabled>Scanează</button>
        <pre id="output"></pre>
    </body>
</html>
